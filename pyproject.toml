[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fpreporter"
version = "0.1.0"
description = "Collects FORCE_PASS usage from Jenkins into a local SQLite audit database."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fpreporter = "fpreporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpreporter = ["groovy/*.groovy", "web/templates/*.html", "web/templates/*/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
