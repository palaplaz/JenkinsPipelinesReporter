# Copy to config.toml and adjust.
# Credentials are NOT stored here: set JENKINS_USER and JENKINS_TOKEN (API token) as environment variables.
# Relative paths are resolved against the directory containing this file.

[jenkins]
url = "https://jenkins.example.com"
verify_tls = true
# The first run scans the full build history, so allow plenty of time.
timeout_seconds = 600

[collector]
parameter_name = "FORCE_PASS"
# Builds started within the last N minutes are left for the next run.
lag_minutes = 5

[storage]
db_path = "data/fp_audit.sqlite"

[web]
host = "127.0.0.1"
port = 8000
# Build parameter shown in the "Reason" column of the builds table.
reason_parameter = "FORCE_PASS_REASON"
